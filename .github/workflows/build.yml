name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build DoorstopFix/DoorstopFix.csproj -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoorstopFix
          path: DoorstopFix/bin/Release/netstandard2.1/DoorstopFix.dll
