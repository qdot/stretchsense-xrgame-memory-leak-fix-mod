name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build DoorstopFix/DoorstopFix.csproj -c Release

      - name: Package release zip
        shell: bash
        run: |
          mkdir -p release/DoorstopFix
          cp DoorstopFix/bin/Release/net48/*.dll release/DoorstopFix/
          cp doorstop/winhttp.dll release/
          cp doorstop/doorstop_config.ini release/
          cd release && 7z a ../DoorstopFix-${{ github.ref_name }}.zip *

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DoorstopFix-${{ github.ref_name }}.zip
          generate_release_notes: true
